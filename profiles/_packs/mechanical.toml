# Starter pack: mechanical / aerospace / manufacturing engineering.
# Edit freely; your profile keeps its own copy as domain.toml.
# Patterns are regular expressions, matched case-insensitively against lower-case text.

# Terms that must NEVER appear in a tailored bullet (confirmed false claims from old resumes).
# The Phase 4 guard rejects any rewrite containing one of these.
forbidden_terms = []   # claims that must never appear in a tailored bullet (e.g. things you removed from old resumes)

# Job titles containing any of these words are dropped by the scraper before analysis (whole words only).
exclude_title_words = ["intern", "interns", "internship", "internships", "apprentice", "apprenticeship",
                       "student", "students", "trainee", "fresher", "freshers",
                       # IT / software roles that full-text job feeds return for "engineer"
                       "data engineer", "software", "developer", "devops", "devsecops", "cloud", "snowflake",
                       "salesforce", "servicenow developer", "full stack", "fullstack", "frontend", "front end",
                       "backend", "back end", "java", "python developer", ".net", "react", "node.js", "sre",
                       "site reliability", "data scientist", "machine learning", "ml engineer", "ai engineer",
                       "network engineer", "security engineer", "cyber", "qa automation", "sdet", "big data",
                       "power bi developer", "etl", "mainframe"]

# Named tools. If a requirement names one of these, a "met" verdict needs evidence that names one of them
# too (e.g. CATIA cannot be proven by a Siemens NX line).
tool_terms = ["CATIA", "Siemens NX", "NX", "Unigraphics", "SolidWorks", "Creo", "Pro/E", "AutoCAD", "Inventor",
              "ANSYS", "Abaqus", "Nastran", "Patran", "HyperMesh", "LS-DYNA", "Teamcenter", "Windchill", "Enovia",
              "3DEXPERIENCE", "SAP", "MATLAB", "Simulink", "Python", "DELMIA", "GD&T", "ServiceNow", "Looker Studio",
              "Jira", "Power BI", "Tableau"]

# Risk flags raised by the model that must stop an automatic approval.
sensitive_flag = '\bstudents?\b|\bintern(ship)?s?\b|visa|work permit|work authori[sz]ation|right to work|clearance|citizen|nationality|native (speaker|level)|\b(french|german|spanish|japanese|dutch|arabic|mandarin)\b'

# Hard blockers stated outright in the job text itself.
sensitive_text = 'currently (pursuing|enrolled)|\bstudents? only\b|\binternships?\b|security clearance|clearance (is )?required|must (be|hold|have) [^.]{0,40}citizen|\b(eu|us|uk|indian) citizens? only|no (visa )?sponsorship|work authori[sz]ation (is )?required'

# Requirement wording -> words that legitimately prove it in a resume line.
# Used by Python to judge whether a quoted Fact Bank line really relates to the requirement.
